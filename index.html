<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小教室簡報生成器 · 懶人包版</title>
<style>
  :root{
    --paper:#FBF6EB; --ink:#1F1D1A; --muted:#6E6A61; --brand:#C8442E; --line:#20201D;
    --c1-bg:#F7D9BB; --c1-ink:#7A3E12; --c2-bg:#CFE6D2; --c2-ink:#2C6140; --c3-bg:#D8DEF4; --c3-ink:#33438A;
    --app-bg:#ECE5D7; --panel:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);
       background:var(--app-bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .bar{flex:none;height:60px;background:var(--panel);border-bottom:2px solid var(--line);
       display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px}
  .bar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;white-space:nowrap}
  .bar .brand .m{display:flex;gap:4px}
  .bar .brand .m i{width:14px;height:14px;border:2px solid var(--line);border-radius:4px;display:block}
  .bar .tagv{font-size:12px;color:var(--muted);border:1.5px solid #d8cfbc;border-radius:20px;padding:2px 10px;font-weight:600}
  .bar .acts{display:flex;gap:8px}
  .btn{border:2px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font:inherit;
       font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--line)}
  .btn.ghost{background:transparent}
  .btn svg{width:17px;height:17px}

  .wrap{flex:1;display:grid;grid-template-columns:420px 1fr;min-height:0}
  .editor{background:var(--panel);border-right:2px solid var(--line);overflow-y:auto;padding:20px}
  .stageWrap{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;min-height:0}

  .hint{background:#FFF3E6;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;
        line-height:1.6;color:#5a4632;margin-bottom:16px}
  .hint b{color:var(--brand)}
  .picker{display:flex;gap:8px;margin-bottom:14px}
  .picker select{flex:1;border:2px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;
       font-weight:600;background:#fff;color:var(--ink)}
  .picker button{border:2px solid var(--line);border-radius:9px;background:var(--brand);color:#fff;font:inherit;
       font-weight:600;font-size:13.5px;padding:0 14px;cursor:pointer;white-space:nowrap}
  .picker button:active{transform:translateY(1px)}
  .blankbtn{width:100%;border:2px solid var(--line);border-radius:9px;background:#fff;padding:9px;font:inherit;
       font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:22px}

  .sec{margin-bottom:18px}
  .sec>h3{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;
          margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid #e7dfce}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#4a463d}
  .fld input[type=text],.fld textarea{width:100%;border:1.5px solid #cfc6b3;border-radius:8px;padding:9px 11px;
       font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--brand)}
  .fld textarea{resize:vertical;min-height:66px;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

  .rowblk{border:1.5px solid #e0d8c6;border-left:5px solid var(--rc,#ccc);border-radius:10px;padding:12px;margin-bottom:10px}
  .rowblk.r1{--rc:var(--c1-ink)} .rowblk.r2{--rc:var(--c2-ink)} .rowblk.r3{--rc:var(--c3-ink)}
  .rowblk.racc{--rc:var(--brand)}
  .rowblk .rh{font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--rc)}

  .prep{margin-top:9px;border:1.5px dashed #cbb8a0;border-radius:8px;background:#FBF6EB;padding:9px 11px}
  .prep label{font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:4px;display:flex;align-items:center;gap:5px}
  .prep textarea{width:100%;border:1px solid #e0d6c2;border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;
       min-height:50px;background:#fff;resize:vertical;line-height:1.55;color:#4a463d}

  .upl{display:flex;align-items:center;gap:10px}
  .upl label.up{border:1.5px solid #cfc6b3;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;
       cursor:pointer;background:#fff;white-space:nowrap}
  .upl label.up:active{transform:translateY(1px)}
  .upl .thumb{width:44px;height:44px;border:1.5px solid #cfc6b3;border-radius:7px;object-fit:cover;display:none;background:#eee}
  .upl .rm{font-size:12px;color:var(--brand);cursor:pointer;font-weight:600;display:none;background:none;border:none}
  .upl input[type=file]{display:none}

  #stage{width:100%;max-width:940px}
  .navrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
  .navbtn{width:40px;height:40px;border:2px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;
          display:flex;align-items:center;justify-content:center}
  .navbtn:active{transform:translateY(1px)} .navbtn svg{width:18px;height:18px}
  .dots{display:flex;gap:8px}
  .dots i{width:9px;height:9px;border:2px solid var(--line);border-radius:50%;cursor:pointer;background:#fff}
  .dots i.on{background:var(--brand)}
  .counter{font-size:13px;color:var(--muted);font-weight:600;min-width:70px;text-align:center}

  /* ============ 投影片本體（cqw 自動縮放，預覽/播放/簡報共用） ============ */
  .slide{width:100%;aspect-ratio:16/9;background:var(--paper);border:2px solid var(--line);border-radius:10px;
         overflow:hidden;container-type:size;position:relative}
  .slide .pad{position:absolute;inset:0;padding:6cqw 7cqw 9.5cqw;display:flex;flex-direction:column}
  .slide .kicker{font-size:2.1cqw;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:1.4cqw}
  .slide .kicker::before{content:"";width:2.4cqw;height:2.4cqw;background:var(--brand);border-radius:4px;display:inline-block}
  .slide .foot{position:absolute;left:7cqw;right:7cqw;bottom:3.4cqw;display:flex;justify-content:space-between;
       font-size:1.9cqw;color:var(--muted);border-top:1.5px solid var(--line);padding-top:1.5cqw}

  .s-cover .pad{justify-content:center}
  .s-cover .kicker::before{display:none}
  .s-cover .title{font-size:9cqw;font-weight:600;line-height:1.03;letter-spacing:-.02em}
  .s-cover .sub{display:inline-block;align-self:flex-start;margin-top:3cqw;background:var(--brand);color:#fff;
       font-size:3cqw;font-weight:600;padding:1.5cqw 2.8cqw;border-radius:8px;line-height:1.35;max-width:84%}
  .s-cover .teacher{margin-top:3.2cqw;font-size:2.4cqw;color:var(--muted);font-weight:600}
  .s-cover .cdots{position:absolute;top:6cqw;right:7cqw;display:flex;gap:1.5cqw}
  .s-cover .cdots i{width:3.2cqw;height:3.2cqw;border:2px solid var(--line);border-radius:6px;display:block}

  .s-point .pad{justify-content:center}
  .s-point .ptext{font-size:4.5cqw;font-weight:600;line-height:1.4;max-width:88%;margin-top:3cqw;
       border-left:1cqw solid var(--brand);padding-left:3.4cqw}

  .cardgrid{flex:1;display:grid;gap:2.2cqw;margin-top:2.2cqw;align-content:center}
  .s-feat .head,.s-acc .head{font-size:4.6cqw;font-weight:600;letter-spacing:-.01em;margin-top:.4cqw}
  .s-feat .card{border:2px solid var(--line);border-radius:12px;padding:2.5cqw 2.5cqw;display:flex;flex-direction:column;gap:1cqw}
  .s-feat .num{width:5cqw;height:5cqw;border:2px solid var(--line);border-radius:9px;background:#fff;
       display:flex;align-items:center;justify-content:center;font-size:2.9cqw;font-weight:600}
  .s-feat .t{font-size:2.7cqw;font-weight:600;line-height:1.12;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s-feat .p{font-size:1.9cqw;color:#4a463d;line-height:1.42;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s-feat .c1{background:var(--c1-bg)} .s-feat .c1 .num{color:var(--c1-ink)}
  .s-feat .c2{background:var(--c2-bg)} .s-feat .c2 .num{color:var(--c2-ink)}
  .s-feat .c3{background:var(--c3-bg)} .s-feat .c3 .num{color:var(--c3-ink)}

  .s-acc .acard{background:#fff;border:2px solid var(--line);border-left:6px solid var(--brand);border-radius:12px;
       padding:2.5cqw 2.5cqw;display:flex;flex-direction:column;gap:1cqw}
  .s-acc .an{font-size:2.7cqw;font-weight:600;line-height:1.12;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s-acc .aw{font-size:1.9cqw;color:#4a463d;line-height:1.45;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .s-hands .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5cqw;align-items:center}
  .s-hands .htag{display:inline-block;background:var(--brand);color:#fff;font-size:2.2cqw;font-weight:600;
       padding:1cqw 2.4cqw;border-radius:8px;margin-bottom:2.2cqw}
  .s-hands h2{font-size:5cqw;font-weight:600;line-height:1.1;margin-bottom:2.4cqw}
  .s-hands .steps{display:flex;flex-direction:column;gap:1.8cqw}
  .s-hands .steps li{list-style:none;display:flex;gap:2cqw;font-size:2.6cqw;line-height:1.35;align-items:flex-start}
  .s-hands .steps li b{flex:none;width:3.8cqw;height:3.8cqw;background:var(--brand);color:#fff;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font-size:2.1cqw;font-weight:600;margin-top:.15cqw}
  .s-hands .shot{aspect-ratio:16/12;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#EAE3D4;
       display:flex;align-items:center;justify-content:center}
  .s-hands .shot img{width:100%;height:100%;object-fit:cover}
  .s-hands .shot span{color:#a79f8f;font-size:2.4cqw;font-weight:600;text-align:center;padding:0 3cqw;line-height:1.5}

  .s-take .pad{justify-content:center}
  .s-take .head{font-size:4.6cqw;font-weight:600}
  .s-take .recap{display:flex;gap:2cqw;margin:2.4cqw 0;flex-wrap:wrap}
  .s-take .chip{display:flex;align-items:center;gap:1.1cqw;background:#fff;border:2px solid var(--line);
       border-radius:10px;padding:1.4cqw 2cqw;font-size:2.1cqw;font-weight:600}
  .s-take .chip b{width:3.2cqw;height:3.2cqw;background:var(--brand);color:#fff;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font-size:1.9cqw;flex:none}
  .s-take .msg{font-size:3.4cqw;font-weight:600;line-height:1.4;max-width:92%}

  /* 全螢幕播放 */
  .present{position:fixed;inset:0;background:#171512;z-index:100;display:none;align-items:center;justify-content:center}
  .present.on{display:flex}
  .present .pstage{width:min(94vw,calc(90vh*16/9));aspect-ratio:16/9}
  .present .pstage .slide{border-radius:0;border:0}
  .present .pnotes{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.82);color:#f0e9db;
       padding:16px 26px;font-size:16px;line-height:1.6;display:none}
  .present .pnotes.on{display:block}
  .present .pnotes b{color:#f0a58c}
  .present .phint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#c9c2b4;font-size:13px;
       background:rgba(0,0,0,.4);padding:7px 16px;border-radius:20px}
  .present .pclose{position:fixed;top:18px;right:18px;color:#fff;background:rgba(255,255,255,.12);border:none;
       width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}

  /* 備課單 */
  .sheet{position:fixed;inset:0;background:rgba(31,29,26,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:30px}
  .sheet.on{display:flex}
  .sheet .card{background:#fff;border:2px solid var(--line);border-radius:14px;max-width:760px;width:100%;
       max-height:86vh;overflow-y:auto;padding:28px 30px}
  .sheet h2{font-size:22px;font-weight:600;margin-bottom:4px}
  .sheet .csub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .sheet .prow{display:flex;gap:14px;padding:14px 0;border-top:1.5px solid #eee4d3}
  .sheet .pn{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;
       display:flex;align-items:center;justify-content:center;font-size:14px}
  .sheet .pt{font-weight:700;font-size:15px;margin-bottom:4px}
  .sheet .pnote{font-size:14px;line-height:1.6;color:#4a463d}
  .sheet .close{float:right;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
       font:inherit;font-weight:600;font-size:13px;cursor:pointer}

  @media(max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .editor{border-right:0;border-bottom:2px solid var(--line);max-height:46vh}}
  /* ===== 選課／文案／海報 彈窗 ===== */
  .ovl{position:fixed;inset:0;background:rgba(31,29,26,.55);z-index:95;display:none;align-items:center;justify-content:center;padding:30px}
  .ovl.on{display:flex}
  .ovl-card{background:#fff;border:2px solid var(--line);border-radius:14px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px 26px}
  .ovl-card h2{font-size:20px;font-weight:600;margin-bottom:14px}
  .ovl .x{float:right;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;margin-left:8px;color:var(--ink)}
  .pickcats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pickcats button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
  .pickcats button.on{background:var(--brand);color:#fff}
  .pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pickcard{border:2px solid var(--line);border-radius:10px;padding:12px 13px;cursor:pointer;background:var(--paper)}
  .pickcard:hover{background:#F3ECDD}
  .pickcard .pc-t{font-weight:700;font-size:14px;line-height:1.3}
  .pickcard .pc-s{font-size:12px;color:var(--muted);margin-top:4px}
  .copycard{border:1.5px solid #e0d8c6;border-radius:10px;margin-bottom:12px;overflow:hidden}
  .copycard .cc-h{display:flex;justify-content:space-between;align-items:center;background:#FBF6EB;padding:9px 12px;border-bottom:1.5px solid #e7dfce}
  .copycard .cc-h b{font-size:13px}
  .copycard .cc-h button{border:2px solid var(--line);background:var(--brand);color:#fff;border-radius:7px;padding:5px 12px;font:inherit;font-weight:600;font-size:12px;cursor:pointer}
  .copycard pre{margin:0;padding:12px;font:inherit;font-size:13px;line-height:1.65;white-space:pre-wrap;color:#3a372f}
  /* 海報（IG 直式 1080x1350，預覽縮放 1/3） */
  .posterScale{width:360px;height:450px;overflow:hidden;border:2px solid var(--line);border-radius:12px;margin:0 auto}
  .posterScale #poster{transform:scale(0.33333);transform-origin:top left}
  #poster{width:1080px;height:1350px;background:var(--paper);position:relative;font-family:"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
  #poster .pp{position:absolute;inset:0;padding:92px 90px;display:flex;flex-direction:column}
  #poster .pk{font-size:26px;letter-spacing:6px;color:var(--muted);font-weight:700}
  #poster .pdots{position:absolute;top:84px;right:90px;display:flex;gap:16px}
  #poster .pdots i{width:42px;height:42px;border:3px solid var(--line);border-radius:10px;display:block}
  #poster .ptitle{font-size:86px;font-weight:600;line-height:1.05;letter-spacing:-2px;margin-top:16px}
  #poster .psub{align-self:flex-start;background:var(--brand);color:#fff;font-size:34px;font-weight:600;padding:16px 26px;border-radius:14px;margin-top:26px;line-height:1.3;max-width:88%}
  #poster .plist{margin-top:44px;display:flex;flex-direction:column;gap:26px}
  #poster .pitem{display:flex;gap:22px;align-items:flex-start}
  #poster .pitem .pn{flex:none;width:62px;height:62px;border:3px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600}
  #poster .pitem.n1 .pn{background:var(--c1-bg);color:var(--c1-ink)}
  #poster .pitem.n2 .pn{background:var(--c2-bg);color:var(--c2-ink)}
  #poster .pitem.n3 .pn{background:var(--c3-bg);color:var(--c3-ink)}
  #poster .pitem .pt{font-size:38px;font-weight:600;line-height:1.2}
  #poster .pitem .pd{font-size:24px;color:#4a463d;margin-top:5px;line-height:1.4}
  #poster .pinfo{margin-top:auto;border:3px solid var(--line);border-radius:18px;padding:28px 32px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;background:#fff}
  #poster .pinfo .row{font-size:27px;font-weight:600}
  #poster .pinfo .k{color:var(--muted);margin-right:10px}
  #poster .pfoot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--line);padding-top:24px}
  #poster .pfoot .cta{font-size:36px;font-weight:600;color:var(--brand)}
  #poster .pfoot .sg{font-size:25px;color:var(--muted);font-weight:600}
  .smartbox{background:#FFF3E6;border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
  .smartbox .sbrow{display:flex;gap:8px}
  .smartbox input{flex:1;border:1.5px solid #cfc6b3;border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
  .smartbox button{border:2px solid var(--line);background:var(--brand);color:#fff;border-radius:8px;padding:0 16px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .smartbox .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .smartbox .presets span{font-size:12px;color:#7a5a3a;border:1px solid #d8b48a;border-radius:14px;padding:3px 10px;cursor:pointer;background:#fff}
  .smartbox .reason{font-size:12.5px;color:var(--brand);font-weight:600;margin-top:8px;min-height:1em}  .posterWrap{display:flex;gap:22px;flex-wrap:wrap}
  .posterFields{flex:1;min-width:250px}
  .posterPreview{flex:none}
  .prow-ed{border:1.5px solid #e0d8c6;border-radius:10px;padding:10px 11px;margin-bottom:10px}
  .prow-ed .prow-hd{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:6px}
  .prow-ed select{width:100%;border:1.5px solid #cfc6b3;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;margin-bottom:6px;background:#fff;color:var(--ink)}
  .prow-ed .pname{width:100%;border:1.5px solid #cfc6b3;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;margin-bottom:6px;background:#fff;color:var(--ink)}
  .prow-ed .two input{border:1.5px solid #cfc6b3;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;width:100%}
  #poster .pclasses{margin-top:38px;display:flex;flex-direction:column;gap:24px}
  #poster .pclass{display:flex;gap:22px;align-items:flex-start;border:3px solid var(--line);border-radius:18px;padding:28px 30px}
  #poster .pclass.n1{background:var(--c1-bg)} #poster .pclass.n2{background:var(--c2-bg)} #poster .pclass.n3{background:var(--c3-bg)}
  #poster .pclass .pcn{flex:none;width:66px;height:66px;border:3px solid var(--line);border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600}
  #poster .pclass .pct{font-size:42px;font-weight:600;line-height:1.15}

const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nl2=s=>esc(s).replace(/\n/g,"<br>");
function setPath(p,v){const ks=p.split(".");let o=state;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}

function handleImage(file, path, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200; let{width:w,height:h}=img;
      if(w>max||h>max){const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r);}
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.82);
      setPath(path,data); save(); cb&&cb(data); render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

}

function fillTopics(cat){
  const sel=document.getElementById("topicSel"); if(!sel)return;
  const list=TOPICS.map((t,i)=>({t,i})).filter(o=>!cat||o.t.cat===cat);
  sel.innerHTML=`<option value="">請選一個主題（${list.length}）</option>`+
    list.map(o=>`<option value="${o.i}">${esc(o.t.label)}</option>`).join("");
}

function bindEditor(){
  const ed=document.getElementById("editor");
  ed.querySelectorAll("[data-path]").forEach(el=>{
    el.addEventListener("input",()=>{
      const p=el.dataset.path;
      if(p.endsWith(".steps")) setPath(p, el.value.split("\n").map(x=>x.trim()).filter(Boolean));
      else setPath(p, el.value);
      save(); render();
    });
  });
  const catSel=ed.querySelector("#catSel");
  if(catSel){ catSel.addEventListener("change",()=>fillTopics(catSel.value)); fillTopics(""); }
  const sel=ed.querySelector("#topicSel");
  ed.querySelector("#loadTopic").addEventListener("click",()=>{ if(sel.value!==""){loadTopic(TOPICS[+sel.value]);} });
  ed.querySelector("[data-blank]").addEventListener("click",()=>{state=BLANK();cur=0;save();buildEditor();render();});
  ed.querySelectorAll("[data-img]").forEach(inp=>{
    inp.addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f)return; const path=inp.dataset.img;
      handleImage(f,path,(data)=>{
        const th=ed.querySelector(`[data-thumb="${path}"]`); if(th){th.src=data;th.style.display="block";}
        const rm=ed.querySelector(`[data-rm="${path}"]`); if(rm)rm.style.display="inline";
      });
    });
  });
  ed.querySelectorAll("[data-rm]").forEach(b=>{
    b.addEventListener("click",()=>{
      const path=b.dataset.rm; setPath(path,""); save(); render();
      const th=ed.querySelector(`[data-thumb="${path}"]`); if(th){th.src="";th.style.display="none";}
      b.style.display="none";
    });
  });
}

/* ============ 產生投影片（固定 6 頁）============ */
function slides(){ return [{k:"cover"},{k:"point"},{k:"feat"},{k:"hands"},{k:"take"},{k:"acc"}]; }
function pageNo(idx){return String(idx+1).padStart(2,"0");}

function slideHTML(sl, idx){
  const s=state, foot=`<div class="foot"><span>${esc(s.cover.store||"Apple Shop")}</span><span>${pageNo(idx)}</span></div>`;
  if(sl.k==="cover"){
    return `<div class="slide s-cover">
      <div class="cdots"><i style="background:var(--c1-bg)"></i><i style="background:var(--c2-bg)"></i><i style="background:var(--c3-bg)"></i></div>
      <div class="pad">
        <div class="kicker">Apple Shop 小教室</div>
        <h1 class="title">${nl2(s.cover.title||"課程主題")}</h1>
        ${s.cover.subtitle?`<span class="sub">${esc(s.cover.subtitle)}</span>`:""}
        ${s.cover.teacher?`<div class="teacher">講師 · ${esc(s.cover.teacher)}</div>`:""}
      </div>${foot}</div>`;
  }
  if(sl.k==="point"){
    return `<div class="slide s-point"><div class="pad">
      <div class="kicker">這堂課重點</div>
      <div class="ptext">${nl2(s.point.text||"一句話講完，這堂課能帶走什麼。")}</div>
      ${s.scenario ? `<div class="scen-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>生活應用情境：${esc(s.scenario)}</div>` : ""}
      ${s.req ? `<div class="req-pill">💻 系統版本需求：${esc(s.req)}</div>` : ""}
    </div>${foot}</div>`;
  }
  if(sl.k==="feat"){
    const c=["c1","c2","c3"];
    const cards=s.features.map((f,i)=>`<div class="card ${c[i]}"><div class="num">${i+1}</div>
      <div class="t">${esc(f.name||"功能 "+(i+1))}</div><div class="p">${esc(f.line)}</div></div>`).join("");
    return `<div class="slide s-feat"><div class="pad">
      <div class="kicker">今天的內容</div>
      <h2 class="head">這堂課學這三個</h2>
      <div class="cardgrid" style="grid-template-columns:repeat(3,1fr)">${cards}</div>
    </div>${foot}</div>`;
  }
  if(sl.k==="hands"){
    const h=s.handson;
    const steps=(h.steps||[]).filter(Boolean).map((st,j)=>`<li><b>${j+1}</b>${esc(st)}</li>`).join("");
    const shotContent = h.shot
      ? `<img src="${h.shot}" alt="示範">`
      : `<div class="before-after-card">
          <div class="ba-cols">
            <div class="ba-col before">
              <span class="ba-tag">Before 痛點</span>
              <div class="ba-desc">${esc(h.before || "平常操作：步驟繁瑣、容易拍暗或找不到功能設定")}</div>
            </div>
            <div class="ba-col after">
              <span class="ba-tag">After 成果</span>
              <div class="ba-desc">${esc(h.after || "學會本招：一指直達、秒出大片、省時俐落")}</div>
            </div>
          </div>
          <div class="ba-vs">VS</div>
          <div class="ba-hint">💡 講師也可點擊左側上傳門市實拍照片更換</div>
        </div>`;
    return `<div class="slide s-hands"><div class="pad"><div class="grid">
      <div>
        <span class="htag">一起動手做</span>
        <h2>${esc(h.title||"一起來試試看")}</h2>
        ${steps?`<ul class="steps">${steps}</ul>`:""}
        ${s.pitfall ? `<div class="hands-pitfall">⚠️ 避坑叮嚀：${esc(s.pitfall)}</div>` : ""}
      </div>
      <div class="shot">${shotContent}</div>
    </div></div>${foot}</div>`;
  }
  if(sl.k==="take"){
    const chips=s.features.map((f,i)=>`<div class="chip"><b>${i+1}</b>${esc(f.name||"功能 "+(i+1))}</div>`).join("");
    return `<div class="slide s-take"><div class="pad">
      <div class="kicker">帶回家</div>
      <h2 class="head">今天記得這三個</h2>
      <div class="recap">${chips}</div>
      <div class="msg">${nl2(s.takehome.text||"回去多用幾次，有問題隨時回來找我們！")}</div>
    </div>${foot}</div>`;
  }
  if(sl.k==="acc"){
    const items=s.accessories.filter(a=>a.name&&a.name.trim());
    const n=Math.max(items.length,1);
    const cards=items.map(a=>`
      <div class="acard">
        ${a.tag ? `<div class="acc-tag">${esc(a.tag)}</div>` : ""}
        <div class="an">${esc(a.name)}</div>
        <div class="aw">${esc(a.why)}</div>
        ${a.benefit ? `<div class="acc-benefit">✨ ${esc(a.benefit)}</div>` : ""}
      </div>
    `).join("") || `<div class="acard"><div class="an">相關配件</div><div class="aw">在左邊填上這堂課適合搭配的配件</div></div>`;
    return `<div class="slide s-acc"><div class="pad">
      <div class="kicker">想玩更進階</div>
      <h2 class="head">這些配件會更順手</h2>
      <div class="cardgrid" style="grid-template-columns:repeat(${n},1fr)">${cards}</div>
    </div>${foot}</div>`;
  }
  return "";
}

/* ============ 渲染預覽 ============ */
function render(){
  const list=slides();
  if(cur>=list.length)cur=list.length-1; if(cur<0)cur=0;
  document.getElementById("stage").innerHTML=slideHTML(list[cur],cur);
  document.getElementById("counter").textContent=`${cur+1} / ${list.length}`;
  document.getElementById("dots").innerHTML=list.map((_,i)=>`<i class="${i===cur?"on":""}" data-i="${i}"></i>`).join("");
  document.querySelectorAll("#dots i").forEach(d=>d.addEventListener("click",()=>{cur=+d.dataset.i;render();}));
  if(document.getElementById("present").classList.contains("on")) renderPresent();
}
document.getElementById("prev").onclick=()=>{cur--;render();};
document.getElementById("next").onclick=()=>{cur++;render();};
document.getElementById("resetBtn").onclick=()=>{ if(confirm("確定要清空全部內容？")){localStorage.removeItem(KEY);state=BLANK();cur=0;buildEditor();render();} };

function renderPresent(){
  document.getElementById("pstage").innerHTML=slideHTML(slides()[cur],cur);
  pnotes.innerHTML=`<b>備課 ${cur+1}｜${PAGE_TITLES[cur]}</b>　${esc(state.prep[cur]||"（這頁沒有備課重點）")}`;
}
document.getElementById("playBtn").onclick=()=>{ present.classList.add("on"); renderPresent();
  if(present.requestFullscreen) present.requestFullscreen().catch(()=>{}); };
function closePresent(){ present.classList.remove("on"); pnotes.classList.remove("on"); if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}); }
document.getElementById("pclose").onclick=closePresent;
document.addEventListener("keydown",e=>{
  if(!present.classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key===" "){cur=Math.min(cur+1,slides().length-1);render();}
  else if(e.key==="ArrowLeft"){cur=Math.max(cur-1,0);render();}
  else if(e.key==="n"||e.key==="N"){pnotes.classList.toggle("on");}
  else if(e.key==="Escape")closePresent();
});
present.addEventListener("click",e=>{ if(e.target.id==="pstage"||e.target===present){cur=Math.min(cur+1,slides().length-1);render();} });

/* 一句話智慧組合：關鍵字 + 生活情境比對 */
const SCEN=[
  {kw:["旅遊","旅行","出國","出遊","達人"],hit:["地圖","翻譯","照片","LINE","Wallet"]},
  {kw:["家人","家庭","親子","長輩","阿公","阿嬤","小孩","孩子","銀髮"],hit:["照片","FaceTime","訊息","家庭共享","LINE"]},
  {kw:["學生","學習","筆記","上課","報告","作業"],hit:["iPad","備忘錄","Keynote","Notion","Pages"]},
  {kw:["工作","上班","效率","辦公","會議","生產力"],hit:["Mac","捷徑","Gemini","Notion","行事曆"]},
  {kw:["健康","運動","睡眠","心率","減肥","體能"],hit:["Watch","健康","AirPods"]},
  {kw:["拍照","攝影","拍","美照","美食","回憶","剪輯","短影音","短影片"],hit:["相機","照片","CapCut","Canva","YouTube","攝影"]},
  {kw:["音樂","聽歌","podcast","播客"],hit:["Spotify","AirPods"]},
  {kw:["ai","智能","智慧","規劃","研究","生成","筆記本"],hit:["Gemini","Apple Intelligence","NotebookLM"]}
];
function findRecommended(s){
  const low=s.toLowerCase();
  const kws=low.split(/[\s,，。！？；:：.?!、]+/).filter(k=>k.length>=1);
  return TOPICS.map((t,i)=>{
    const hay=(t.title+" "+(t.note||"")+" "+(t.subtitle||"")+" "+t.features.map(f=>f.name+" "+f.line).join(" ")).toLowerCase();
    let sc=0,m=[];
    kws.forEach(kw=>{ if(hay.includes(kw))sc+=2.5; if(t.title.toLowerCase().includes(kw)){sc+=9;m.push(kw);} });
    SCEN.forEach(g=>{ if(g.kw.some(k=>low.includes(k))){ const h=g.hit.filter(x=>t.title.includes(x)); if(h.length){sc+=5;m.push(...h);} } });
    return {t,i,sc,why:[...new Set(m)].slice(0,3).join("、")||"貼近你的描述"};
  }).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3);
}
function doSmart(){
  const s=(document.getElementById("smartInput").value||"").trim();
  const rz=document.getElementById("smartReason");
  if(!s){ alert("先打一句話，例如：我想教長輩用 LINE 傳照片給家人"); return; }
  smartSentence=s;
  document.querySelectorAll("#pickCats button").forEach(x=>x.classList.remove("on"));
  const rec=findRecommended(s);
  const grid=document.getElementById("pickGrid");
  if(!rec.length){ rz.textContent="沒配到很貼近的課，換個說法，或直接下面選分類。"; fillPickGrid(""); return; }
  rz.textContent="幫你配到這幾堂（點卡片帶入，副標會用你這句話）：";
  grid.innerHTML=rec.map(o=>`<div class="pickcard" data-i="${o.i}" style="border-color:var(--brand);background:#FFF3E6"><div class="pc-t">${esc(o.t.title)}</div><div class="pc-s">為什麼：${esc(o.why)}</div></div>`).join("");
  grid.querySelectorAll(".pickcard").forEach(cd=>cd.onclick=()=>pickLoad(+cd.dataset.i));
}

    let o;
    if(r.sel==="cur")o={title:state.cover.title,sub:state.cover.subtitle,feats:state.features};
    else if(r.sel!==""){const t=TOPICS[+r.sel];o=t?{title:t.title,sub:t.subtitle,feats:t.features}:{title:"",sub:"",feats:[]};}
    else o={title:"",sub:"",feats:[]};
    if(hasName)o.title=r.name;
    o.date=r.date;o.time=r.time;
    return o;
  }).filter(o=>o&&o.title&&o.title.trim());
  const dots=`<div class="pdots"><i style="background:var(--c1-bg)"></i><i style="background:var(--c2-bg)"></i><i style="background:var(--c3-bg)"></i></div>`;
  let inner;
  if(cls.length<=1){
    const c=cls[0]||{title:state.cover.title,sub:state.cover.subtitle,feats:state.features,date:"",time:""};
    const items=(c.feats||[]).filter(f=>f.name&&f.name.trim()).slice(0,3).map((f,i)=>`<div class="pitem ${col[i]}"><div class="pn">${i+1}</div><div><div class="pt">${esc(f.name)}</div><div class="pd">${esc(f.line||"")}</div></div></div>`).join("");
    const info=[["📅 日期",c.date],["⏰ 時間",c.time],["📍 地點",e.place],["✍ 報名",e.signup]].filter(r=>r[1]&&r[1].trim()).map(r=>`<div class="row"><span class="k">${r[0]}</span>${esc(r[1])}</div>`).join("");
    inner=`<div class="pp"><div class="pk">Apple Shop 小教室・免費參加</div><div class="ptitle">${esc(state.poster.title||c.title||"課程主題")}</div>${c.sub?`<div class="psub">${esc(c.sub)}</div>`:""}<div class="plist">${items}</div>${info?`<div class="pinfo">${info}</div>`:""}<div class="pfoot"><div class="cta">${esc(state.poster.cta||"歡迎報名 →")}</div><div class="sg">${esc(e.signup||state.cover.store||"門市報名")}</div></div></div>`;
  } else {
    const list=cls.map((c,i)=>`<div class="pclass ${col[i]}"><div class="pcn">${i+1}</div><div><div class="pct">${esc(c.title)}</div>${c.sub?`<div class="pcs">${esc(c.sub)}</div>`:""}<div class="pcdt">${[c.date,c.time].filter(x=>x&&x.trim()).map(esc).join("　")||"時間詳見現場"}</div></div></div>`).join("");
    const foot=[e.place&&("📍 "+e.place),e.signup&&("✍ "+e.signup)].filter(Boolean).map(esc).join("　　");
    inner=`<div class="pp"><div class="pk">Apple Shop 小教室・免費參加</div><div class="ptitle" style="font-size:72px">${esc(state.poster.title||"近期小教室課表")}</div><div class="pclasses">${list}</div>${foot?`<div class="pschedfoot">${foot}</div>`:""}</div>`;
  }
  document.getElementById("poster").innerHTML=dots+inner;
}
function _crc32(buf){let c=~0;for(let i=0;i<buf.length;i++){c^=buf[i];for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;}return ~c;}
function _pngChunk(type,data){
  const t=new Uint8Array(4);for(let i=0;i<4;i++)t[i]=type.charCodeAt(i);
  const len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,data.length);
  const cd=new Uint8Array(4+data.length);cd.set(t,0);cd.set(data,4);
  const crcB=new Uint8Array(4);new DataView(crcB.buffer).setUint32(0,_crc32(cd)>>>0);
  const ch=new Uint8Array(12+data.length);ch.set(len,0);ch.set(t,4);ch.set(data,8);ch.set(crcB,8+data.length);
  return ch;
}
function _pngWithDPI(dataURL,dpi){
  const bin=atob(dataURL.split(",")[1]);const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ppm=Math.round(dpi/0.0254);
  const phys=new Uint8Array(9);const dv=new DataView(phys.buffer);dv.setUint32(0,ppm);dv.setUint32(4,ppm);phys[8]=1;
  const chunk=_pngChunk("pHYs",phys);
  const out=new Uint8Array(bytes.length+chunk.length);
  out.set(bytes.slice(0,33),0);out.set(chunk,33);out.set(bytes.slice(33),33+chunk.length);
  return out;
}
function downloadPoster(){
  if(typeof html2canvas==="undefined"){alert("產生海報需要網路連線（第一次載入截圖元件）。請連上網路後再試。");return;}
  const node=document.getElementById("poster");
  html2canvas(node,{scale:3,backgroundColor:"#FBF6EB",useCORS:true}).then(cv=>{
    let blob;
    try{ blob=new Blob([_pngWithDPI(cv.toDataURL("image/png"),300)],{type:"image/png"}); }
    catch(e){ blob=null; }
    const a=document.createElement("a");
    a.download=(state.cover.title||"小教室").replace(/[\\/:*?"<>|]/g,"")+"_宣傳海報_300dpi.png";
    if(blob){ a.href=URL.createObjectURL(blob); } else { a.href=cv.toDataURL("image/png"); }
    document.body.appendChild(a);a.click();
    setTimeout(()=>{if(blob)URL.revokeObjectURL(a.href);a.remove();},1200);
  }).catch(err=>alert("產生海報失敗："+err.message));
}
